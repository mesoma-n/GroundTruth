[project]
name = "groundtruth-lab"
version = "0.1.0"
description = "Dependency-free evaluation harness for structured LLM outputs"
requires-python = ">=3.10"

[project.scripts]
groundtruth = "groundtruth.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
